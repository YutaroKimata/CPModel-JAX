[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cpmodel-jax"
version = "0.5.0"
description = "Matrix-free Newton–Krylov solver for the Caliendo–Parro model"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["jax>=0.11.2,<0.12", "numpy>=2,<3"]

[project.optional-dependencies]
dev = ["pytest>=9", "ruff>=0.16", "build>=1.6"]

[tool.setuptools]
py-modules = ["cpmodel_jax"]
package-dir = {"" = "src"}

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
